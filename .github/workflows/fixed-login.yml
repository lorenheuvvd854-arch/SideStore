name: SideStore (fixed login)

on:
  workflow_dispatch:
  push:
    branches: [fixed-login]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - run: brew install ldid xcbeautify
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"
      - name: Build
        run: python3 scripts/ci/workflow.py build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build/logs
      - name: Variant without app extensions (for SideInstaller / Sideloadly / other signers)
        run: |
          rm -rf noext && mkdir noext && cd noext
          unzip -q ../SideStore.ipa
          rm -rf Payload/*.app/PlugIns Payload/*.app/Extensions
          zip -qry ../SideStore-NoExtensions.ipa Payload
          cd .. && unzip -l SideStore-NoExtensions.ipa | grep -c appex || true
      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-fixed-login.ipa
          path: SideStore.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-NoExtensions.ipa
          path: SideStore-NoExtensions.ipa
